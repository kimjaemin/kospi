name: 데이터 갱신

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 평일 18:30 (한국 시간), 장 마감 후
    - cron: "0 23 * * *"     # 매일 08:00 (한국 시간), 늦게 올라온 시가총액 반영
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas pyarrow requests finance-datareader lxml
      - name: 데이터 받기와 웹앱 데이터 만들기
        id: update
        run: python scripts/update_all.py
        continue-on-error: true
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          # meta.json의 생성 시각만 바뀐 경우는 커밋하지 않는다
          if git diff --cached --quiet -- data docs/data/index.json docs/data/top; then
            echo "새 데이터 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
      - name: 갱신 실패 알림
        if: steps.update.outcome == 'failure'
        run: exit 1
